name: Hello GitHub Actions practice

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from GitHub Actions!"

      - name: Show date
        run: date

      - name: Show Operating System
        run: uname -a
    
  exercise:
    runs-on: ubuntu-latest

    steps:
      - name: python-version
        run: python --version

      - name: git version
        run: git --version

      - name: current directory
        run: pwd

      - name: files list
        run: ls -la
      