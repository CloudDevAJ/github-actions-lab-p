name: Hello GitHub Actions practice

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from GitHub Actions!"

      - name: Show Operating System
        run: uname -a
    
  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Show date
        run: date